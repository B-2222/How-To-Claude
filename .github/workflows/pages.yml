name: Publish web build

# Publishes the committed web/ export to GitHub Pages. It does not build the
# game: exporting needs the Godot editor binary plus the ~1 GB export template
# package, and downloading both on every push costs far more CI time than the
# 35 MB build is worth. Re-export locally (see README) and commit web/.
on:
  push:
    branches: [claude/godot-trickshot-shooter-29h93f]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; queue instead of cancelling a live publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        # enablement turns Pages on for the repository if it is off, so this
        # works on a fresh repo with no manual setup.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the export
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
